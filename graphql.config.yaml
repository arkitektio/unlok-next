projects:
  unlok:
    schema: https://go.arkitekt.live/lok/schema
    documents: graphql/*/**.graphql
    extensions:
      turms:
        out_dir: unlok_next/api
        exclude_typenames: true
        dump_configuration: true
        dump_schema: true
        freeze:
          enabled: true
        options:
          enabled: true
          populate_by_name: true
          alias_mode: split
          use_enum_values: true
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.funcs.FuncsPlugin
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
            global_kwargs:
              - type: unlok_next.rath.UnlokRath
                key: rath
                description:
                  The client we want to use (defaults to the currently active
                  client)
            definitions:
              - type: subscription
                is_async: true
                use: unlok_next.funcs.asubscribe
              - type: query
                is_async: true
                use: unlok_next.funcs.aexecute
              - type: mutation
                is_async: true
                use: unlok_next.funcs.aexecute
              - type: subscription
                use: unlok_next.funcs.subscribe
              - type: query
                use: unlok_next.funcs.execute
              - type: mutation
                use: unlok_next.funcs.execute
        processors:
          - type: turms.processors.black.BlackProcessor
        scalar_definitions:
          uuid: str
          Callback: str
          Any: typing.Any
          ID: rath.scalars.ID
          Version: str
          AppIdentifier: str
          UnsafeChild: typing.Any
          ServiceIdentifier: str
          Identifier: str
