fragment ListRedeemToken on RedeemToken {
  id
  token
  user {
    id
    email
  }
  client {
    id
    release {
      version
      app {
        identifier
      }
    }
  }
}

fragment DetailRedeemToken on RedeemToken {
  id
  token
  expiresAt
  maxRedemptions
  redemptionCount
  pinnedManifest
  user {
    id
    email
  }
  client {
    id
    clientId
    release {
      version
      app {
        identifier
      }
    }
  }
}
