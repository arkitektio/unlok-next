authentikate:
  audience: "*"
  # `issuers` is supplied by the compose file (AUTHENTIKATE__ISSUERS): its `iss`
  # has to equal the OIDC issuer URL lok mints tokens with, which carries the
  # host port of the current run.
  static_tokens: {}
postgres:
  db_name: lok
  dependency: db
  engine: django.db.backends.postgresql
  host: db
  password: hello_django
  port: 5432
  username: hello_django
redis:
  dependency: redis
  host: redis
  port: 6379
  channel_prefix: lok
datalayer:
  access_key: minio_access_key
  secret_key: minio_secret_key
  host: minio
  port: 9000
  protocol: http
  media:
    bucket: media
scopes:
  openid: The open id connect scope
  read: A generic read access
  write: A generic write access
kommunity_partners:
  - identifier: localhost
    name: Localhost
    partner_kind: preauthorized
    auto_configure: true
    preconfigured_hub:
      identifier: localhost
      description: The hub every test client enrols into.
organizations:
  - name: Demo
    identifier: demo
    owner: demo
    auto_configure: true
users:
  - name: Demo User
    username: demo
    password: demo
    email: demo@example.com
memberships:
  - user: demo
    organization: demo
redeem_tokens:
  - token: unlok-integration-tests-redeem-token
    user: demo
    organization: demo
    hub: localhost
    expires_in_days: null
    max_redemptions: null
account:
  email_verification: none
  login_methods: [username]
