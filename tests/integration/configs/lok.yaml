# Configuration of the lok service inside the integration test stack
# (tests/integration/docker-compose.yml). Everything in here is throwaway:
# the signing key was generated for this stack only, the passwords are fixed,
# and `debug: true` is what permits the empty `static_tokens` block.
#
# The organisation `demo` auto-configures the `localhost` hub from the
# `localhost` kommunity partner, and the redeem token below is issued for that
# hub: the test session redeems it (tests/conftest.py) to become a real,
# development client of the `demo` organisation, exactly the way a deployed
# container authenticates.
deployment:
  name: unlok-tests
django:
  admin:
    email: admin@example.com
    password: admin
    username: admin
  debug: true
  hosts:
    - "*"
  secret_key: unlok-integration-tests-secret-key-not-for-production
  csrf_trusted_origins:
    - http://localhost
  # The fakts envelope advertises lok itself under the `/lok` path, so the
  # service has to be served there, as in every real deployment.
  force_script_name: lok
