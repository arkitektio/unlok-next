services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/daten:next
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: lok
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  lok:
    depends_on:
    - redis
    - db
    - rustfs
    - initc
    image: jhnnsrs/lok:${LOK_SERVICE_TAG:-next}
    command: bash run-debug.sh
    stop_grace_period: 1s
    ports:
    - "${LOK_HOST_PORT:-6888}:80"
    environment:
      # lok anchors every endpoint in its discovery document (and the `iss` claim
      # of the tokens it mints) to this URL rather than to the request host, so it
      # must be where the tests reach the service from the host: the published
      # port of this run. The origin only -- the `/lok` script prefix is already
      # part of every reversed path.
      OIDC_ISSUER: http://localhost:${LOK_HOST_PORT:-6888}
      # authentikate looks the verifying key up by the token's `iss`, so the
      # trusted-issuer entry must name the same URL; the key is the public half
      # of the throwaway signing key in configs/lok.yaml.
      AUTHENTIKATE__ISSUERS: '[{"kind": "rsa", "iss": "http://localhost:${LOK_HOST_PORT:-6888}", "kid": "lok-key-1", "public_key": "ssh-rsa "}]'
    volumes:
    - ./configs/lok.yaml:/workspace/config.yaml
  rustfs:
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: rustfs/rustfs:latest
    ports:
    - "${RUSTFS_HOST_PORT:-6889}:9000"
  initc:
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_HOST: http://rustfs:9000
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: jhnnsrs/init:next
    volumes:
    - ./configs/rustfs.yaml:/workspace/config.yaml
