[project]
name = "unlok"
dynamic = ["version"]
description = "The arkitekt client for lok: users, clients, hubs and redeem tokens"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "rath>=3.7",
    "websockets>=15.0.1",
]

[tool.uv]
dev-dependencies =  [
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest>=8.3.5",
    "python-semantic-release>=9.21.0",
    "autoflake>=1.7.7,<2",
    "aiohttp>=3.8.3,<4",
    "black>=23.1.0,<24",
    "pytest-aiohttp>=1.0.4,<2",
    "ruff>0.11",
    "basedpyright>=1.21",
    # The integration stack (tests/conftest.py) is driven by dokker; >=2.8 for the
    # owner-labelled stacks that let a run reap what a killed run left behind.
    "dokker>=2.8",
    # The integration session authenticates the way a deployed app does -- by
    # redeeming the stack's provisioned token through fakts' redeem grant -- and
    # `unlok.arkitekt` composes its links from `fakts.contrib.rath`.
    "fakts>=2",
]

[tool.hatch.build.targets.sdist]
include = ["unlok"]

[tool.hatch.build.targets.wheel]
include = ["unlok"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# repository carries it. Renamed from `unlok-next` at 1.4.0: the first tag on
# this name must be v2.0.0 (PyPI already holds `unlok` 0.1.x from the previous
# generation), which a `feat!:` commit makes semantic-release cut.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.basedpyright]
include = ["unlok"]
exclude = ["**/__pycache__", "tests"]
typeCheckingMode = "standard"

[tool.mypy]
exclude = ["venv/", "tests/"]
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["ANN", "D1"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require a deployment via docker compose (dokker)",
    "linux_only: marks tests that only run on Linux",
    "no_windows: marks tests that are skipped on Windows",
]

[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the release notes focused on user-facing changes. These patterns only
# filter what's rendered - they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]
